name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Mutation testing is minutes, not seconds, so it runs nightly rather than on
    # every push. A gate people learn to skip is worse than no gate.
    #
    # Free without limit on public repositories, which is what this one is meant
    # to become. While it is private the allowance is two thousand minutes a
    # month and a nightly mutation run is a real fraction of it — a hosted runner
    # has a few cores where the machine this was measured on has twelve, so nine
    # minutes there is closer to forty here. If that starts to bite, turn the
    # schedule off rather than the gate: the per-push job is the one that keeps
    # anybody honest.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The pushed range, for `cargo dacc msg-check --range`.
          fetch-depth: 0

      # No toolchain is named here on purpose: rust-toolchain.toml is the single
      # place the version is decided, and a second one would drift from it.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny

      # The same revision Cargo.toml pins; a second copy of the revision would
      # drift from the first. The CLI is installed at exactly that revision, not
      # at the latest on crates.io, which would leap ahead of the tree.
      - name: Install cargo-dacc
        run: |
          DACC_VERSION="$(sed -n 's/^dacc-core = "\([0-9.]*\)".*/\1/p' Cargo.toml)"
          cargo install --locked dacc-cli --version "$DACC_VERSION"

      # One entry point, and the same one a developer runs before pushing. A CI
      # file that grows its own list of steps ends up checking something subtly
      # different from what anybody can reproduce locally — which is also why
      # there is one of these files rather than two. GitLab holds a copy of the
      # repository and nothing else; a second gate on a mirror nobody reviews in
      # is a second thing to keep in step, and it would drift.
      - name: Gate
        run: cargo xtask ci

      # Every pushed commit carries a basis; the check runs over the whole
      # pushed range, not just the tip.
      #
      # The first push to an empty repository is the whole history. Commits
      # before the slug convention — dacc 0.2.0, 2274c575 — carry no basis, a
      # Slipway-Work trailer, or a numeric work id (`Dacc-Work: w0017`), all of
      # which msg-check rightly refuses. The check never reaches before the
      # convention starts.
      - name: Commit messages
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if ! git merge-base --is-ancestor 2274c575 "$BEFORE" 2>/dev/null; then
            BEFORE="2274c575"
          fi
          cargo dacc msg-check --range "$BEFORE..${{ github.event.after }}"

  mutants:
    name: mutants
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants

      # Cheap next to mutation testing, and it needs the same thing: a release
      # build and a machine that is not also doing something else.
      - name: Plan budget
        run: cargo xtask budget

      - name: Mutation testing
        run: cargo xtask mutants

      # The surviving mutants are the whole point of the run, so keep them even
      # when — especially when — the job fails.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutants
          path: mutants.out
