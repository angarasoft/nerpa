name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Mutation testing is minutes, not seconds, so it runs nightly rather than on
    # every push. A gate people learn to skip is worse than no gate.
    #
    # This is the mirror, and Actions is free without limit on public
    # repositories — which is why the nightly run lives here rather than on
    # GitLab, where the same job would eat a free tier's whole month.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: rust-toolchain.toml is the single
      # place the version is decided, and a second one would drift from it.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny

      # One entry point, and the same one a developer runs before pushing. A CI
      # file that grows its own list of steps ends up checking something subtly
      # different from what anybody can reproduce locally.
      - name: Gate
        run: cargo xtask ci

  mutants:
    name: mutants
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants

      - name: Mutation testing
        run: cargo xtask mutants

      # The surviving mutants are the whole point of the run, so keep them even
      # when — especially when — the job fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: mutants.out
