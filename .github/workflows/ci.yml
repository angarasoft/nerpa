name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: rust-toolchain.toml is the single
      # place the version is decided, and a second one would drift from it.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      # Contracts are compiled in by default. Building without them proves the
      # code does not quietly depend on their side effects.
      - name: Test without contracts
        run: cargo test --no-default-features
