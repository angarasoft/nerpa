[workspace]
resolver = "3"
members = [
  "crates/nerpa-cli",
  "crates/nerpa-config",
  "crates/nerpa-core",
  "crates/nerpa-executor",
  "crates/nerpa-transport",
  "crates/nerpa-proto",
  "crates/nerpa-provider-os",
  "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Anishchuk Sergei <anishukserg@gmail.com>"]
# The public home, under the project's own organisation rather than a personal
# account: a crate outlives whoever published it, and a link through one person's
# username is a link that breaks the day the project stops being one person's.
# It is also where the gate runs. GitLab holds a copy against the day GitHub is
# not there, and nothing else.
repository = "https://github.com/nerpa-run/nerpa"
homepage = "https://github.com/nerpa-run/nerpa"
documentation = "https://docs.rs/nerpa-core"
readme = "README.md"
keywords = ["infrastructure", "configuration", "iac", "provisioning"]
categories = ["command-line-utilities", "config", "development-tools"]

[workspace.dependencies]
# The version is here as well as in the package because a path dependency without
# one is a wildcard, and a wildcard cannot be published. Two places to keep in
# step on a release, which the release script does.
nerpa-config = { path = "crates/nerpa-config", version = "=0.0.1" }
nerpa-core = { path = "crates/nerpa-core", version = "=0.0.1" }
nerpa-executor = { path = "crates/nerpa-executor", version = "=0.0.1" }
nerpa-proto = { path = "crates/nerpa-proto", version = "=0.0.1" }
nerpa-transport = { path = "crates/nerpa-transport", version = "=0.0.1" }
nerpa-provider-os = { path = "crates/nerpa-provider-os", version = "=0.0.1" }

thiserror = "2.0"
# The Starlark implementation from Meta, the one Buck2 runs on. Chosen in 0005;
# `allocative` comes with it and is required of any value put on its heap.
starlark = "0.14"
# The parser crate underneath `starlark`, taken directly for its AST visitor.
# Two operations cannot be refused at the value level — see 0018 — and catching
# them needs a walk over the syntax tree before evaluation begins.
starlark_syntax = "0.14"
allocative = "0.3"
# Jinja, by the author of Jinja2. A template that looks like the file it produces
# is the reason anybody can read a configuration, and matching a predecessor
# exactly is the feature here rather than a failure of nerve. Chosen in 0023
# against tera, measured rather than assumed: twenty idioms from real Ansible
# templates, nineteen accepted here and twelve there.
minijinja = { version = "2.24", default-features = false, features = ["builtins", "loader", "fuel", "macros", "multi_template"] }
# `pycompat` answers the twentieth: Jinja templates call Python methods on
# values, and this maps them onto filters.
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
toml = "1.1"
# State has to outlive the process, so it has to be written down. JSON because
# it is what a state file is read back by — a person with `jq`, or a tool that is
# not this one.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CBOR on the wire: self-describing enough to version, compact enough that a
# file's contents are not doubled in transit, and it does not carry JSON's
# inability to say "these are bytes".
ciborium = "0.2"
# What makes `Vec<u8>` a CBOR byte string rather than an array of numbers. Serde
# has no way to tell them apart on its own, so the property CBOR was chosen for
# has to be asked for by name.
serde_bytes = "0.11"
clap = { version = "4.6", features = ["derive"] }
# A scratch directory that removes itself, so a failing test leaves no litter.
tempfile = "3"
# Generated values, for the claims no list of examples can attack: that the
# canonical encoding is injective, and that a value survives being written down.
# A digest is only worth what those two are worth.
proptest = "1.9"
# Keyed hashing, for the digests state keeps of secrets it must not keep. One
# crate rather than the two an HMAC needs, and the same primitive will serve the
# plan hash and the hash-chained log when those arrive.
blake3 = "1.8"
# Thirty-two random bytes for a state file's digest key, and nothing else.
getrandom = "0.4"
# Bytes in a human-readable state file. JSON has no way to say "these are
# bytes", and an array of numbers cannot be told apart from a list of integers.
base64 = "0.23"
# `flock`, and nothing else from it. A lock held by the kernel is released when
# the process ends however it ends, which a lock file's existence cannot do: a
# run that was killed left a file that refused every later run until somebody
# deleted it by hand — the one thing a lock exists to stop them doing carelessly.
# Already in this tree under `starlark`, so nothing new is compiled for it, and
# it keeps the `unsafe` a raw call would need out of a workspace that denies it.
rustix = { version = "1.1", features = ["fs"] }

# Lint levels live here, at the workspace, and they are set now rather than
# later on purpose. Turning a strict lint on across a thousand lines is an
# afternoon; across fifty thousand it is a mechanical change nobody reviews and
# a temptation to sprinkle `allow` until it goes quiet.
[workspace.lints.rust]
# Denied, not forbidden, and the difference is deliberate. `forbid` cannot be
# lifted anywhere, and Starlark's derives — `ProvidesStaticType` among them —
# generate `unsafe impl`. The choice was between not using Starlark and letting
# exactly one crate opt out with a written reason. `deny` everywhere else means
# the rule still holds for every line anybody writes by hand.
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# A tool that changes production must not have a way to stop without saying why.
#
# `expect` is deliberately not banned alongside `unwrap`. Denying both pushes
# people towards `unwrap_or_default()`, which turns an impossible case into a
# wrong answer instead of a loud stop — strictly worse. `unwrap` says "this
# cannot fail" and gives nobody a reason; `expect` says the same and leaves the
# reason in the panic message. `cargo xtask lint` is the second net.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Debugging leftovers.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Conversions that can silently lose information have no place near a plan hash.
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_lossless = "deny"

# Two pedantic lints that fight the way this code is written, rather than
# improving it. `module_name_repetitions` would rename `graph::GraphError` to
# something worse, and `must_use_candidate` wants an attribute on every getter.
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Not ours to fix. Starlark's dependency tree carries duplicate versions of half
# a dozen crates, and the lint cannot tell an avoidable duplicate from one three
# levels down in somebody else's manifest. `cargo xtask deny` still reports them.
multiple_crate_versions = "allow"

# A project-wide stance rather than a per-site exception. Errors here carry whole
# addresses and the message somebody reads at three in the morning, not a code to
# look up. That makes them large, and every fallible function in the workspace
# returns one on a path that runs once per plan, not once per resource. Said here
# once instead of at a dozen call sites.
result_large_err = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Nerpa changes infrastructure. A panic must unwind so that guards holding a
# state lock or a half-open transport get to run their destructors; aborting
# would leave a lock file behind on a machine nobody is watching.
# Do not set panic = "abort".
