[package]
name = "nerpa"
description = "The nerpa command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "nerpa"
path = "src/main.rs"

[dependencies]
# The run journal is a hash chain: blake3 is the same primitive the plan hash
# and the state digests use, per the workspace manifest.
blake3.workspace = true
dacc-derive = { workspace = true }
nerpa-config = { workspace = true }
nerpa-core = { workspace = true }
nerpa-engine = { workspace = true }
nerpa-import = { workspace = true }
nerpa-transport = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ssh-keygen wants the signature in a file while it is checked; this is the
# scratch that removes itself, the same one the state machinery uses.
tempfile = { workspace = true }

[dev-dependencies]
# The command is exercised against a real state directory, which goes in a
# scratch directory that removes itself.
tempfile = { workspace = true }
# The approval tests assemble an approval by hand — the bypass a person with a
# text editor has — and a plan document is JSON.
serde_json = { workspace = true }
# The import-to-plan exit test drives the same crates the command does, as a
# library rather than a process, so a recorded exchange can stand in for a cloud.
nerpa-config = { workspace = true }
nerpa-core = { workspace = true }
nerpa-import = { workspace = true }
nerpa-provider-yandex = { workspace = true }

[lints]
workspace = true
