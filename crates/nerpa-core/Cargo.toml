[package]
name = "nerpa-core"
description = "Resource model, planner and state for Nerpa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["strict-contracts"]

# Runtime assertions that state what the type system cannot. They cost a few
# comparisons next to the network round trips a real run makes, and they turn a
# silent wrong answer into a loud failure. See `contract` for why they are on by
# default in release builds too.
strict-contracts = []

[dependencies]
base64.workspace = true
nerpa-proto = { workspace = true }
blake3.workspace = true
getrandom.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The wire round-trip is checked against the encoding the wire uses.
ciborium = { workspace = true }
proptest = { workspace = true }
# The round-trip test writes a plan out and reads it back.
serde_json = { workspace = true }
