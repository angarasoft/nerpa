[package]
name = "nerpa-provider-yandex"
description = "Yandex Cloud resources in the control domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = { workspace = true }
dacc-derive = { workspace = true }
nerpa-core = { workspace = true }
prost = "0.14"
prost-types = "0.14"
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
# The fake cloud's server takes incoming connections from a listener stream.
tokio-stream = "0.1"

[lints]
workspace = true
