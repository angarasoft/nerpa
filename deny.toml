# Cut down to what a project with one dependency needs.
# The allowlist is the point: a licence that is not on it stops the build rather
# than being noticed during an audit two years later.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # rsa's PKCS#1 v1.5 is not constant-time (Marvin Attack), but the provider
    # signs a JWT locally, once per token exchange, never on a network-observable
    # path — the timing observation the advisory describes cannot happen there.
    { id = "RUSTSEC-2023-0071", reason = "the provider signs a JWT locally, not on a network-observable path" },
]

[licenses]
version = 2
allow = [
  # Nerpa itself, and most of what it depends on.
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Boost, not the Business Source License — permissive, OSI approved, FSF free.
  # Arrives through `rustyline`, which `starlark` depends on unconditionally for
  # its REPL. Not feature-gated upstream, so the only alternatives were allowing
  # it or not using Starlark.
  "BSL-1.0",
  # Root certificates are data, not code; webpki-roots carries them under the
  # Community Data License Agreement, which exists for exactly that.
  "CDLA-Permissive-2.0",
]

[bans]
# Two versions of one crate in the tree means two copies of its bugs and two
# things to patch when an advisory lands.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
