# What a plan is allowed to cost.
#
# Planning touches no network and no disk: it is arithmetic over declarations,
# so its cost is a property of the code rather than of the day. That makes it
# something a gate can hold, and `cargo xtask budget` holds it.
#
# Two numbers, and the difference between them is the point.
#
#   baseline_seconds — what the code does today. Exceeding it is a regression
#                      and is refused. Raising it needs a changelog entry saying
#                      what was bought with it.
#   budget_seconds   — what it ought to cost. The gap is printed on every run,
#                      so it stays a number somebody is looking at rather than
#                      an intention.
#
# The gap this file was written to record has been closed. Planning used to walk
# the graph and ask `Graph::dependencies_of` for every resource, and that call
# rebuilt every edge in the graph, so the work grew with the square of the
# number of resources. It now asks `Graph::dependencies` once and reads the
# answer. Measured on one machine, release build, one run per point:
#
#                    before      after
#     2000            0.29 s     0.03 s
#     4000            1.26 s     0.06 s
#     8000            6.37 s     0.12 s
#    16000              —        0.24 s
#
# Four times the resources used to be twenty-one times the work and is now four
# times the work. A hundred machines carrying eighty resources each is 8000, and
# reaching a fleet is what stage 1 exists to do.
#
# The budget now sits at what the code actually does, which is what a closed gap
# looks like. `cargo xtask budget` says "lower both numbers" whenever the
# measurement is under the budget, so leaving a decorative gap would leave a
# standing complaint — and it would be recording an aspiration nobody has a plan
# for, in a file that exists to hold facts.
#
# The measurement sits between 0.06 and 0.08 depending on what else the machine
# is doing, and the budget is set at the top of that band. Chasing the noise
# downward would only make the report alternate between its two wordings.
#
# The baseline carries headroom over the measurement above, because this runs on
# whatever machine is free rather than on a bench. Headroom is not slack to
# spend: a measurement that has crept up to meet it is a regression that has not
# been noticed yet.

[plan]
resources = 4000
budget_seconds = 0.07
baseline_seconds = 0.15
