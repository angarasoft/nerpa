# The invariant registry.
#
# An invariant is a guarantee Nerpa must hold under every circumstance, and
# whose violation means a wrong change to somebody's infrastructure. Writing
# them down here rather than only in prose makes them traceable: each one names
# the code that enforces it and the tests that prove it, and `tests/invariants.rs`
# fails if either end of that link rots.
#
# The reverse edge is an `// ENFORCES: INV-...` comment at the code site, in the
# spirit of `// SAFETY:`. The registry test checks both directions — every
# enforced invariant is anchored in code, and every anchor names a real id.
#
# `status`:
#   enforced — code and tests exist today
#   planned  — decided in the architecture, not yet built

[[invariant]]
id = "INV-ADDR-001"
status = "enforced"
statement = "A resource address contains no index."
rationale = """
An ordinal position in a list is not an identity. Removing an entry from the \
middle renumbers everything after it, and a planner that believes those numbers \
proposes destroying live resources that merely moved. There is no field and no \
constructor that could hold one."""
enforced_by = ["crates/nerpa-core/src/address.rs"]
tests = ["slots_let_two_versions_coexist", "addresses_are_built_as_well_as_parsed"]

[[invariant]]
id = "INV-ADDR-002"
status = "enforced"
statement = "No component of an address begins with `-`."
rationale = """
Addresses are interpolated into SSH command lines and provider invocations. A \
name that reads as an option is a remote code execution waiting for a careless \
call site, so the type refuses to hold one."""
enforced_by = ["crates/nerpa-core/src/address.rs"]
tests = ["nothing_can_be_mistaken_for_a_command_line_option"]

[[invariant]]
id = "INV-ADDR-003"
status = "enforced"
statement = "Address text round-trips: parsing then printing yields the input."
rationale = """
The plan hash is taken over canonical text. A value that printed differently \
from the way it parsed would produce two hashes for one plan and invalidate a \
signature that was given in good faith."""
enforced_by = ["crates/nerpa-core/src/address.rs"]
tests = ["every_shape_round_trips"]

[[invariant]]
id = "INV-DOMAIN-001"
status = "enforced"
statement = "Execution domain is derived from the address, never stored beside it."
rationale = """
A separate field is a second source of truth, and the two can disagree. The \
planner would then look for a node the address says is not there, or skip one \
that is."""
enforced_by = ["crates/nerpa-core/src/domain.rs"]
tests = ["control_resources_have_no_node", "target_resources_name_the_node_they_live_on"]

[[invariant]]
id = "INV-GRAPH-001"
status = "enforced"
statement = "The resource graph is acyclic, and a cycle is reported deterministically."
rationale = """
A cycle is a configuration error, not a runtime condition, so it must be found \
before anything is touched. Reporting it the same way every time matters because \
the report is what somebody debugs at three in the morning."""
enforced_by = ["crates/nerpa-core/src/graph.rs"]
tests = ["a_cycle_is_reported_with_every_resource_in_it", "cycle_reports_do_not_depend_on_insertion_order"]

[[invariant]]
id = "INV-GRAPH-002"
status = "enforced"
statement = "Every declared dependency names a resource that exists in the graph."
rationale = """
A dangling edge means the planner would silently ignore an ordering somebody \
asked for. Failing closed is the only safe reading."""
enforced_by = ["crates/nerpa-core/src/graph.rs"]
tests = ["a_dependency_on_a_missing_resource_is_refused"]

[[invariant]]
id = "INV-GRAPH-003"
status = "enforced"
statement = "An attribute reading from another resource is an edge in the graph."
rationale = """
Ordering that depends on somebody remembering to declare it is where ordering \
bugs come from. If a value is read from another resource, the reader waits for \
it whether or not anyone noticed."""
enforced_by = ["crates/nerpa-core/src/graph.rs", "crates/nerpa-core/src/attribute.rs"]
tests = [
  "an_attribute_reading_from_another_resource_is_an_ordering",
  "two_references_to_one_resource_are_still_one_ordering",
]

[[invariant]]
id = "INV-GRAPH-004"
status = "enforced"
statement = "Everything on a node is ordered after whatever brings that node into existence."
rationale = """
A target-domain address names its node as text, and nothing in that text says \
who creates it. Without the inventory edge the package would be free to run \
before the machine exists — and a resource whose node nobody declared is refused \
rather than ordered last, because that would be a guess dressed up as a decision."""
enforced_by = ["crates/nerpa-core/src/graph.rs"]
tests = [
  "everything_on_a_node_waits_for_whatever_creates_it",
  "a_resource_on_a_node_nobody_declared_is_refused",
  "a_node_that_was_already_there_adds_no_ordering",
]

[[invariant]]
id = "INV-PLAN-001"
status = "enforced"
statement = "An unresolved value never determines which resources exist."
rationale = """
This is what makes a single planning pass possible at all. Held by three \
mechanisms rather than one, because the toolchain allows only some of them to be \
precise: ordering, indexing and iteration are refused by the value itself; \
equality and containment are refused by a pass over the syntax tree, because \
Starlark answers them without consulting the value; and truthiness is recorded \
and the whole run refused, because `to_bool` has no error channel. See 0018."""
enforced_by = [
  "crates/nerpa-config/src/handle.rs",
  "crates/nerpa-config/src/refuse.rs",
]
tests = [
  "comparing_a_value_that_does_not_exist_yet_is_refused_before_anything_runs",
  "branching_on_a_value_that_does_not_exist_yet_refuses_the_whole_run",
  "iterating_a_value_that_does_not_exist_yet_is_refused",
  "indexing_a_value_that_does_not_exist_yet_is_refused",
]

[[invariant]]
id = "INV-PLAN-002"
status = "enforced"
statement = "Planning is one pass; stages belong to execution."
rationale = """
Two planning passes would mean a plan that is only partly known, which cannot be \
signed as a whole. Stages order the work; they do not order the thinking. The \
planner walks the graph once and never returns to a stage it has left."""
enforced_by = ["crates/nerpa-core/src/planner.rs"]
tests = [
  "stages_with_nothing_to_do_are_left_out_but_order_is_kept",
  "a_graph_that_cannot_be_ordered_is_not_planned_at_all",
]

[[invariant]]
id = "INV-PLAN-003"
status = "enforced"
statement = "Applying a plan and planning again produces an empty plan."
rationale = """
Convergence is the property this tool exists to have, and the one nobody \
remembers to assert. It rests on references resolving against what already \
exists: a value read from another resource is unresolved in the text but known \
in the world once that resource is there, and without that the reader would \
differ on every run for ever."""
enforced_by = ["crates/nerpa-core/src/planner.rs"]
tests = [
  "planning_after_applying_produces_an_empty_plan",
  "a_resource_that_already_matches_produces_nothing",
  "a_reference_to_something_that_exists_is_already_known",
]

[[invariant]]
id = "INV-PLAN-004"
status = "enforced"
statement = "A plan carries everything needed to apply it, without the configuration."
rationale = """
A plan is what gets signed and what gets handed to something that never saw the \
program. Carrying only the attributes that differ would make it unusable on its \
own — an unchanged path is still needed to write the file. Deltas are for \
reading; the desired state is for doing."""
enforced_by = ["crates/nerpa-core/src/plan.rs", "crates/nerpa-core/src/run.rs"]
tests = [
  "a_file_edited_by_hand_is_brought_back",
  "an_unresolved_value_is_settled_from_the_stage_before_it",
]

[[invariant]]
id = "INV-STATE-002"
status = "enforced"
statement = "A resource is removed before whatever it depended on."
rationale = """
Removal order cannot come from the configuration, because the configuration that \
described the dependency is exactly what was deleted. It comes from the edges \
recorded when the resource was last applied. The other way round takes a network \
down before the machine on it."""
enforced_by = ["crates/nerpa-core/src/state.rs"]
tests = [
  "what_depended_on_a_thing_is_removed_before_the_thing",
  "a_resource_removed_from_the_configuration_is_removed_from_the_machine",
]

[[invariant]]
id = "INV-STATE-003"
status = "enforced"
statement = "A resource that moved is found where it was, not where it should be."
rationale = """
Reading at the new declared location finds nothing and proposes making a second \
resource, abandoning the first. Only state remembers where Nerpa left it, and \
without that a change of location is silently a duplication."""
enforced_by = ["crates/nerpa-core/src/run.rs"]
tests = ["moving_a_file_replaces_it_and_takes_the_old_one_with_it"]

[[invariant]]
id = "INV-STATE-001"
status = "planned"
statement = "State holds references to secrets and digests of their values, never the values."
rationale = """
Terraform state carries passwords in clear text, which is why it needs whole-file \
encryption and still leaks through every backup. A state that never held the \
value has nothing to leak."""
enforced_by = []
tests = []

[[invariant]]
id = "INV-STATE-004"
status = "enforced"
statement = "State is written whole, or the previous one is left intact."
rationale = """
A half-written state file claims things that are not true, which is worse than \
no state file: it will be believed. Written beside the target and moved into \
place, so an interrupted run leaves the previous state rather than half of two. \
And two runs cannot hold it at once, because each would write what the other did \
not know about."""
enforced_by = ["crates/nerpa-core/src/store.rs"]
tests = [
  "writing_replaces_the_previous_file_only_once_it_is_whole",
  "two_runs_cannot_hold_the_state_at_once",
  "a_file_from_a_version_this_one_does_not_understand_is_refused",
]

[[invariant]]
id = "INV-AGENT-001"
status = "enforced"
statement = "The plan a person reads and the plan a machine reads are the same object."
rationale = """
Every machine-readable output in this space is an afterthought bolted onto text \
meant for people, which is why automating them means parsing prose. Here the text \
is a rendering of the typed plan and `--json` writes the same object, so the two \
cannot come to disagree about what the plan says."""
enforced_by = ["crates/nerpa-core/src/plan.rs", "crates/nerpa-cli/src/render.rs"]
tests = ["a_plan_survives_a_trip_through_json"]

[[invariant]]
id = "INV-REACH-001"
status = "enforced"
statement = "A machine that did not answer is refused per resource, not per run."
rationale = """
Refusing the whole run because one machine is down blocks changes to every other \
machine, which is how people learn to work around a tool. Everything readable is \
planned; what could not be read appears saying so, with the machine and the age \
of the newest knowledge, and nothing is claimed about it. See 0020."""
enforced_by = ["crates/nerpa-core/src/planner.rs", "crates/nerpa-core/src/run.rs"]
tests = [
  "a_resource_on_a_machine_that_did_not_answer_is_not_planned",
  "nothing_at_all_is_said_about_what_could_not_be_read",
  "a_machine_not_answering_lets_the_reading_continue",
]

[[invariant]]
id = "INV-REACH-002"
status = "enforced"
statement = "Only a machine not answering lets a run continue; every other refusal stops it."
rationale = """
Treating a permission error as unreachability would quietly stop managing a \
resource because of a typo in an access rule — the class of silent wrongness this \
project exists to avoid. The provider has to tell them apart, and the type makes \
it say which."""
enforced_by = ["crates/nerpa-core/src/provider.rs", "crates/nerpa-core/src/run.rs"]
tests = ["any_other_refusal_still_stops_the_run"]

[[invariant]]
id = "INV-REACH-003"
status = "enforced"
statement = "A plan that could not look at everything is not complete, and says so."
rationale = """
Nobody can approve a change to infrastructure they were unable to see. Such a \
plan carries an age, an age moves every second, and a hash over it never settles \
— so it cannot be signed. Stated by name rather than left as an unexplained hash \
mismatch, because that is a mystery at three in the morning."""
enforced_by = ["crates/nerpa-core/src/plan.rs", "crates/nerpa-cli/src/render.rs"]
tests = [
  "what_could_not_be_looked_at_is_reported_with_its_age_and_never_as_work",
  "the_age_of_what_is_known_comes_from_state",
]

[[invariant]]
id = "INV-DRIFT-001"
status = "planned"
statement = "A resource marked for merging is never overwritten without a person."
rationale = """
Portage's CONFIG_PROTECT, and for the same reason: people edit machines during \
incidents, and the edit is often the only record of what the incident was."""
enforced_by = ["crates/nerpa-core/src/resource.rs"]
tests = ["drift_is_corrected_unless_the_resource_asks_to_be_merged"]

[[invariant]]
id = "INV-TRUST-001"
status = "planned"
statement = "No run proceeds without an actor identity; static keys are not a mode."
rationale = """
Not a recommendation but an absence: there is no code path that reads a long-lived \
key, so no deadline can produce one."""
enforced_by = []
tests = []
