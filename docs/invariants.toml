# The invariant registry.
#
# An invariant is a guarantee Nerpa must hold under every circumstance, and
# whose violation means a wrong change to somebody's infrastructure. Writing
# them down here rather than only in prose makes them traceable: each one names
# the code that enforces it and the tests that prove it, and `tests/invariants.rs`
# fails if either end of that link rots.
#
# The reverse edge is an `// ENFORCES: INV-...` comment at the code site, in the
# spirit of `// SAFETY:`. The registry test checks both directions — every
# enforced invariant is anchored in code, and every anchor names a real id.
#
# Every built invariant also writes down `bypass`: what an attempt to violate it
# would actually look like. That field is the work this registry exists to force.
# A guarantee nobody can describe a way around has not been thought about, and
# the difference between the two statuses below is entirely whether somebody
# wrote the attempt down and watched it be refused.
#
# `status`:
#   planned  — decided in the architecture, not yet built
#   claimed  — code and tests exist, and the bypass named below is open or
#              untried. The guarantee is believed, not demonstrated
#   enforced — as above, and `adversarial` names tests that carry out the bypass
#              and assert it is refused. Where the types make a violation
#              impossible to write at all, `bypass = "unrepresentable"` and no
#              such test can exist
#
# Moving an entry from `claimed` to `enforced` requires the test, not an opinion
# — rule 3 in RULES.md. The four entries sitting at `claimed` today each have a
# bypass that was reproduced against this code, not imagined.

[[invariant]]
id = "INV-ADDR-001"
status = "enforced"
statement = "A resource address contains no index."
rationale = """
An ordinal position in a list is not an identity. Removing an entry from the \
middle renumbers everything after it, and a planner that believes those numbers \
proposes destroying live resources that merely moved. There is no field and no \
constructor that could hold one."""
enforced_by = ["crates/nerpa-core/src/address.rs"]
tests = ["slots_let_two_versions_coexist", "addresses_are_built_as_well_as_parsed"]
bypass = "unrepresentable"

[[invariant]]
id = "INV-ADDR-002"
status = "enforced"
statement = "No component of an address begins with `-`."
rationale = """
Addresses are interpolated into SSH command lines and provider invocations. A \
name that reads as an option is a remote code execution waiting for a careless \
call site, so the type refuses to hold one."""
enforced_by = ["crates/nerpa-core/src/address.rs"]
tests = ["nothing_can_be_mistaken_for_a_command_line_option"]
bypass = "An address read from text whose component begins with `-`, then interpolated into a command line."
adversarial = [
  "nothing_can_be_mistaken_for_a_command_line_option",
]

[[invariant]]
id = "INV-ADDR-003"
status = "enforced"
statement = "Address text round-trips: parsing then printing yields the input."
rationale = """
The plan hash is taken over canonical text. A value that printed differently \
from the way it parsed would produce two hashes for one plan and invalidate a \
signature that was given in good faith."""
enforced_by = ["crates/nerpa-core/src/address.rs"]
tests = ["every_shape_round_trips"]
bypass = "A shape that prints differently from the way it parsed: a name holding a separator, a component the grammar admits but Display does not reproduce."
adversarial = [
  "every_shape_round_trips",
]

[[invariant]]
id = "INV-DOMAIN-001"
status = "enforced"
statement = "Execution domain is derived from the address, never stored beside it."
rationale = """
A separate field is a second source of truth, and the two can disagree. The \
planner would then look for a node the address says is not there, or skip one \
that is."""
enforced_by = ["crates/nerpa-core/src/domain.rs"]
tests = ["control_resources_have_no_node", "target_resources_name_the_node_they_live_on"]
bypass = "unrepresentable"

[[invariant]]
id = "INV-GRAPH-001"
status = "enforced"
statement = "The resource graph is acyclic, and a cycle is reported deterministically."
rationale = """
A cycle is a configuration error, not a runtime condition, so it must be found \
before anything is touched. Reporting it the same way every time matters because \
the report is what somebody debugs at three in the morning."""
enforced_by = ["crates/nerpa-core/src/graph.rs"]
tests = ["a_cycle_is_reported_with_every_resource_in_it", "cycle_reports_do_not_depend_on_insertion_order"]
bypass = "Edges that close a loop, or two runs disagreeing about which resources a cycle holds up."
adversarial = [
  "a_cycle_is_reported_with_every_resource_in_it",
  "cycle_reports_do_not_depend_on_insertion_order",
]

[[invariant]]
id = "INV-GRAPH-002"
status = "enforced"
statement = "Every declared dependency names a resource that exists in the graph."
rationale = """
A dangling edge means the planner would silently ignore an ordering somebody \
asked for. Failing closed is the only safe reading."""
enforced_by = ["crates/nerpa-core/src/graph.rs"]
tests = ["a_dependency_on_a_missing_resource_is_refused"]
bypass = "An `after` naming a resource nobody declared, silently ignored instead of refused."
adversarial = [
  "a_dependency_on_a_missing_resource_is_refused",
]

[[invariant]]
id = "INV-GRAPH-003"
status = "enforced"
statement = "An attribute reading from another resource is an edge in the graph."
rationale = """
Ordering that depends on somebody remembering to declare it is where ordering \
bugs come from. If a value is read from another resource, the reader waits for \
it whether or not anyone noticed."""
enforced_by = ["crates/nerpa-core/src/graph.rs", "crates/nerpa-core/src/attribute.rs"]
tests = [
  "an_attribute_reading_from_another_resource_is_an_ordering",
  "two_references_to_one_resource_are_still_one_ordering",
]
bypass = "An attribute reading from another resource with no edge recorded, or one resource read twice and counted as two orderings so it never becomes ready."
adversarial = [
  "two_references_to_one_resource_are_still_one_ordering",
]

[[invariant]]
id = "INV-GRAPH-004"
status = "enforced"
statement = "Everything on a node is ordered after whatever brings that node into existence."
rationale = """
A target-domain address names its node as text, and nothing in that text says \
who creates it. Without the inventory edge the package would be free to run \
before the machine exists — and a resource whose node nobody declared is refused \
rather than ordered last, because that would be a guess dressed up as a decision."""
enforced_by = ["crates/nerpa-core/src/graph.rs"]
tests = [
  "everything_on_a_node_waits_for_whatever_creates_it",
  "a_resource_on_a_node_nobody_declared_is_refused",
  "a_node_that_was_already_there_adds_no_ordering",
]
bypass = "A resource on a node the inventory does not know, ordered last as a guess instead of refused."
adversarial = [
  "a_resource_on_a_node_nobody_declared_is_refused",
]

[[invariant]]
id = "INV-PLAN-001"
status = "claimed"
statement = "An unresolved value never determines which resources exist."
rationale = """
This is what makes a single planning pass possible at all. Held by three \
mechanisms rather than one, because the toolchain allows only some of them to be \
precise: ordering, indexing and iteration are refused by the value itself; \
equality and containment are refused by a pass over the syntax tree, because \
Starlark answers them without consulting the value; and truthiness is recorded \
and the whole run refused, because `to_bool` has no error channel. See 0018.

The syntax pass follows the taint rather than matching a shape. It used to match \
one — a bare attribute access beside `==` — and a review got past it in two \
lines by storing the handle in a dictionary first. Opacity now spreads through \
assignments, containers, indexing, slicing, iteration, comprehensions and \
function returns."""
enforced_by = [
  "crates/nerpa-config/src/handle.rs",
  "crates/nerpa-config/src/refuse.rs",
]
tests = [
  "comparing_a_value_that_does_not_exist_yet_is_refused_before_anything_runs",
  "branching_on_a_value_that_does_not_exist_yet_refuses_the_whole_run",
  "iterating_a_value_that_does_not_exist_yet_is_refused",
  "indexing_a_value_that_does_not_exist_yet_is_refused",
  "comparing_ordinary_values_is_still_allowed",
]
bypass = "An opaque value reaching a comparison through a function *parameter*. The analysis follows names, containers, indexing, iteration and returns, but not arguments — following those needs the call sites of every function, which a single walk of one module does not have. Inside such a function the value still refuses when both sides are its own type, and Starlark still answers silently when one side is a constant."
adversarial = [
  "a_value_that_does_not_exist_yet_cannot_be_laundered_through_a_dictionary",
  "a_value_that_does_not_exist_yet_cannot_be_laundered_through_a_list",
  "a_value_that_does_not_exist_yet_cannot_be_handed_out_of_a_function",
  "a_value_that_does_not_exist_yet_cannot_be_tested_for_membership",
  "a_comprehension_over_a_deferred_list_is_refused",
]

[[invariant]]
id = "INV-PLAN-002"
status = "enforced"
statement = "Planning is one pass; stages belong to execution."
rationale = """
Two planning passes would mean a plan that is only partly known, which cannot be \
signed as a whole. Stages order the work; they do not order the thinking. The \
planner walks the graph once and never returns to a stage it has left."""
enforced_by = ["crates/nerpa-core/src/planner.rs"]
tests = [
  "stages_with_nothing_to_do_are_left_out_but_order_is_kept",
  "a_graph_that_cannot_be_ordered_is_not_planned_at_all",
]
bypass = "A graph that cannot be ordered yielding a partial plan rather than none at all."
adversarial = [
  "a_graph_that_cannot_be_ordered_is_not_planned_at_all",
]

[[invariant]]
id = "INV-PLAN-003"
status = "claimed"
statement = "Applying a plan and planning again produces an empty plan."
rationale = """
Convergence is the property this tool exists to have, and the one nobody \
remembers to assert. It rests on references resolving against what already \
exists: a value read from another resource is unresolved in the text but known \
in the world once that resource is there, and without that the reader would \
differ on every run for ever."""
enforced_by = ["crates/nerpa-core/src/planner.rs"]
tests = [
  "planning_after_applying_produces_an_empty_plan",
  "a_resource_that_already_matches_produces_nothing",
  "a_reference_to_something_that_exists_is_already_known",
]
bypass = "A declared attribute the provider does not report back after applying. It is never settled, so every run proposes the same update and no run is ever empty. Reproduced: a file declared with an attribute the `os` provider does not own converges on paper and re-plans for ever."

[[invariant]]
id = "INV-PLAN-004"
status = "enforced"
statement = "A plan carries everything needed to apply it, without the configuration."
rationale = """
A plan is what gets signed and what gets handed to something that never saw the \
program. Carrying only the attributes that differ would make it unusable on its \
own — an unchanged path is still needed to write the file. Deltas are for \
reading; the desired state is for doing."""
enforced_by = ["crates/nerpa-core/src/plan.rs", "crates/nerpa-core/src/run.rs"]
tests = [
  "a_file_edited_by_hand_is_brought_back",
  "an_unresolved_value_is_settled_from_the_stage_before_it",
]
bypass = "A change applied by re-reading the graph rather than from the plan, so what was approved and what happens can differ."
adversarial = [
  "a_file_edited_by_hand_is_brought_back",
]

[[invariant]]
id = "INV-STATE-002"
status = "enforced"
statement = "A resource is removed before whatever it depended on."
rationale = """
Removal order cannot come from the configuration, because the configuration that \
described the dependency is exactly what was deleted. It comes from the edges \
recorded when the resource was last applied. The other way round takes a network \
down before the machine on it."""
enforced_by = ["crates/nerpa-core/src/state.rs"]
tests = [
  "what_depended_on_a_thing_is_removed_before_the_thing",
  "a_resource_removed_from_the_configuration_is_removed_from_the_machine",
]
bypass = "A removal ordered from the configuration, which by definition no longer describes the thing being removed."
adversarial = [
  "what_depended_on_a_thing_is_removed_before_the_thing",
]

[[invariant]]
id = "INV-STATE-003"
status = "enforced"
statement = "A resource that moved is found where it was, not where it should be."
rationale = """
Reading at the new declared location finds nothing and proposes making a second \
resource, abandoning the first. Only state remembers where Nerpa left it, and \
without that a change of location is silently a duplication."""
enforced_by = ["crates/nerpa-core/src/run.rs"]
tests = ["moving_a_file_replaces_it_and_takes_the_old_one_with_it"]
bypass = "A moved resource looked for where the declaration now points, found missing, and made a second time."
adversarial = [
  "moving_a_file_replaces_it_and_takes_the_old_one_with_it",
]

[[invariant]]
id = "INV-STATE-001"
status = "planned"
statement = "State holds references to secrets and digests of their values, never the values."
rationale = """
Terraform state carries passwords in clear text, which is why it needs whole-file \
encryption and still leaks through every backup. A state that never held the \
value has nothing to leak."""
enforced_by = []
tests = []

[[invariant]]
id = "INV-STATE-004"
status = "claimed"
statement = "State is written whole, or the previous one is left intact."
rationale = """
A half-written state file claims things that are not true, which is worse than \
no state file: it will be believed. Written beside the target and moved into \
place, so an interrupted run leaves the previous state rather than half of two. \
And two runs cannot hold it at once, because each would write what the other did \
not know about."""
enforced_by = ["crates/nerpa-core/src/store.rs"]
tests = [
  "writing_replaces_the_previous_file_only_once_it_is_whole",
  "two_runs_cannot_hold_the_state_at_once",
  "a_file_from_a_version_this_one_does_not_understand_is_refused",
]
bypass = "A second way of writing state that reaches for `fs::write` instead of going through `durably` — the short form is one line and the durable form is five, and nothing in the types marks which is which. Below that, a disk that acknowledges a sync it has not performed, which nothing in this process can detect. Kept `claimed` rather than `enforced` because the three syncs are there and nobody has pulled the power cord to watch them work."

[[invariant]]
id = "INV-AGENT-001"
status = "enforced"
statement = "The plan a person reads and the plan a machine reads are the same object."
rationale = """
Every machine-readable output in this space is an afterthought bolted onto text \
meant for people, which is why automating them means parsing prose. Here the text \
is a rendering of the typed plan and `--json` writes the same object, so the two \
cannot come to disagree about what the plan says."""
enforced_by = ["crates/nerpa-core/src/plan.rs", "crates/nerpa-cli/src/render.rs"]
tests = ["a_plan_survives_a_trip_through_json"]
bypass = "Text rendered from anything other than the typed plan, so the page a person approves and the document a machine reads drift apart."
adversarial = [
  "a_plan_survives_a_trip_through_json",
]

[[invariant]]
id = "INV-BIRTH-001"
status = "enforced"
statement = "An attribute a resource was born with is reported, never turned into work."
rationale = """
A running machine's boot disk cannot be swapped underneath it, so editing an \
image reference must not become a proposal to destroy the fleet. But silence is \
the other failure: `ignore_changes` is how a fleet ends up years behind with \
nobody aware. Reported on every plan, acted on never. Moving a fleet is a \
deliberate act. See 0021."""
enforced_by = ["crates/nerpa-core/src/planner.rs", "crates/nerpa-cli/src/render.rs"]
tests = [
  "editing_the_image_does_not_propose_to_destroy_anything",
  "but_it_is_reported_every_time",
  "being_born_with_something_never_becomes_a_replacement",
  "a_fleet_behind_its_declaration_is_told_about_and_never_planned",
]
bypass = "A birth attribute turned into work — which proposes destroying a fleet over an edited image reference — or dropped silently instead of reported."
adversarial = [
  "being_born_with_something_never_becomes_a_replacement",
  "a_fleet_behind_its_declaration_is_told_about_and_never_planned",
]

[[invariant]]
id = "INV-COMPAT-001"
status = "planned"
statement = "A configuration declares the versions it needs, and a build that does not satisfy it refuses."
rationale = """
Ansible's playbooks broke every release because a playbook declares nothing: it \
calls a module by name and hopes, and finds out at runtime on a machine. A stated \
requirement turns a silent change of behaviour into a refusal before anything is \
touched. See 0022."""
enforced_by = []
tests = []

[[invariant]]
id = "INV-COMPAT-002"
status = "planned"
statement = "The plan for a recorded configuration does not change without the change being declared."
rationale = """
The plan is the compatibility surface, and a corpus of configurations with their \
plans checked in makes that promise something a machine verifies rather than \
something a person intends. A version that changes one either has a bug or has \
made a decision, and the changelog entry is what failed the build until written."""
enforced_by = []
tests = []

[[invariant]]
id = "INV-WIRE-001"
status = "enforced"
statement = "A frame written by a protocol version this build does not know is refused, not partly believed."
rationale = """
An executor built from one version outlives the engine that installed it, so \
every later engine has to keep talking to it. Every frame carries the version it \
was written by, and an unknown one is refused rather than read as a subset — \
guessing at a protocol is how two ends come to disagree about what they agreed."""
enforced_by = ["crates/nerpa-proto/src/lib.rs"]
tests = ["a_frame_from_another_version_is_refused_rather_than_guessed_at"]
bypass = "A frame stamped with a version this build does not know, read as though it were a subset of one it does."
adversarial = [
  "a_frame_from_another_version_is_refused_rather_than_guessed_at",
]

[[invariant]]
id = "INV-WIRE-002"
status = "enforced"
statement = "A frame's announced size is checked before any of it is allocated."
rationale = """
The length prefix is an instruction to allocate that arrives from the other end \
of a pipe. Believing it is how a peer that is confused, old or hostile turns a \
number into memory exhaustion. Bounded, and refused above the bound before a byte \
is reserved."""
enforced_by = ["crates/nerpa-proto/src/lib.rs"]
tests = [
  "an_enormous_announced_frame_is_refused_before_anything_is_allocated",
  "a_pipe_that_ends_mid_frame_says_so",
]
bypass = "A length prefix believed before the allocation it asks for: the number arrives from the far end of a pipe."
adversarial = [
  "an_enormous_announced_frame_is_refused_before_anything_is_allocated",
  "a_pipe_that_ends_mid_frame_says_so",
]

[[invariant]]
id = "INV-BATCH-001"
status = "enforced"
statement = "Reading a machine takes one journey, however many resources are on it."
rationale = """
The difference between reading a fleet in seconds and reading it in minutes, and \
a property of the interface rather than of any transport: an interface that can \
only ask about one resource makes the fast version unrepresentable however good \
the connection underneath is. This is what Ansible gets wrong, one round trip per \
task. The engine groups by machine before asking, and a batch never spans two."""
enforced_by = ["crates/nerpa-core/src/run.rs", "crates/nerpa-core/src/provider.rs"]
tests = [
  "every_resource_on_one_machine_is_asked_for_at_once",
  "separate_machines_are_separate_journeys",
  "something_only_state_remembers_travels_with_the_rest",
]
bypass = "A provider asked once per resource rather than once per machine, which no transport underneath can make fast again."
adversarial = [
  "every_resource_on_one_machine_is_asked_for_at_once",
  "separate_machines_are_separate_journeys",
]

[[invariant]]
id = "INV-REACH-001"
status = "enforced"
statement = "A machine that did not answer is refused per resource, not per run."
rationale = """
Refusing the whole run because one machine is down blocks changes to every other \
machine, which is how people learn to work around a tool. Everything readable is \
planned; what could not be read appears saying so, with the machine and the age \
of the newest knowledge, and nothing is claimed about it. See 0020."""
enforced_by = [
  "crates/nerpa-core/src/planner.rs",
  "crates/nerpa-core/src/run.rs",
  "crates/nerpa-cli/src/main.rs",
]
tests = [
  "a_resource_on_a_machine_that_did_not_answer_is_not_planned",
  "nothing_at_all_is_said_about_what_could_not_be_read",
  "a_machine_not_answering_lets_the_reading_continue",
]
bypass = "One machine not answering refusing the whole run, or its resources being planned anyway from state that is out of date."
adversarial = [
  "a_resource_on_a_machine_that_did_not_answer_is_not_planned",
  "nothing_at_all_is_said_about_what_could_not_be_read",
]

[[invariant]]
id = "INV-REACH-002"
status = "enforced"
statement = "Only a machine not answering lets a run continue; every other refusal stops it."
rationale = """
Treating a permission error as unreachability would quietly stop managing a \
resource because of a typo in an access rule — the class of silent wrongness this \
project exists to avoid. The provider has to tell them apart, and the type makes \
it say which."""
enforced_by = ["crates/nerpa-core/src/provider.rs", "crates/nerpa-core/src/run.rs"]
tests = ["any_other_refusal_still_stops_the_run"]
bypass = "A permission error read as unreachability, which quietly stops managing a resource over a typo in an access rule."
adversarial = [
  "any_other_refusal_still_stops_the_run",
]

[[invariant]]
id = "INV-REACH-003"
status = "enforced"
statement = "A plan that could not look at everything is not complete, and says so."
rationale = """
Nobody can approve a change to infrastructure they were unable to see. Such a \
plan carries an age, an age moves every second, and a hash over it never settles \
— so it cannot be signed. Stated by name rather than left as an unexplained hash \
mismatch, because that is a mystery at three in the morning."""
enforced_by = ["crates/nerpa-core/src/plan.rs", "crates/nerpa-cli/src/render.rs"]
tests = [
  "what_could_not_be_looked_at_is_reported_with_its_age_and_never_as_work",
  "the_age_of_what_is_known_comes_from_state",
]
bypass = "A plan that could not read everything presenting itself as complete, and so as signable."
adversarial = [
  "what_could_not_be_looked_at_is_reported_with_its_age_and_never_as_work",
]

[[invariant]]
id = "INV-DRIFT-001"
status = "planned"
statement = "A resource marked for merging is never overwritten without a person."
rationale = """
Portage's CONFIG_PROTECT, and for the same reason: people edit machines during \
incidents, and the edit is often the only record of what the incident was."""
enforced_by = ["crates/nerpa-core/src/resource.rs"]
tests = ["drift_is_corrected_unless_the_resource_asks_to_be_merged"]

[[invariant]]
id = "INV-TRUST-001"
status = "planned"
statement = "No run proceeds without an actor identity; static keys are not a mode."
rationale = """
Not a recommendation but an absence: there is no code path that reads a long-lived \
key, so no deadline can produce one."""
enforced_by = []
tests = []

[[invariant]]
id = "INV-SECRET-001"
status = "enforced"
statement = "A secret attribute never reports a value through the accessor everything that writes things down goes through."
rationale = """
`Attribute::known` is what every part of the engine that persists or prints \
reaches for, so a secret answering `None` there makes the guarantee structural \
rather than a rule each caller has to remember. The value exists — somewhere \
else, behind a `Source` — and reaching it takes a deliberate fetch."""
enforced_by = ["crates/nerpa-core/src/attribute.rs"]
tests = [
  "a_recorded_secret_shows_that_it_is_one_and_nothing_more",
  "a_password_reaches_the_file_and_nothing_else",
]
bypass = "A secret reaching the accessor that rendering, state and the plan all read through, and being written down by one of them."
adversarial = [
  "a_recorded_secret_shows_that_it_is_one_and_nothing_more",
]

[[invariant]]
id = "INV-SECRET-002"
status = "enforced"
statement = "A secret value is reduced to a keyed digest before it can be written into state or a plan."
rationale = """
Terraform's state is a plaintext dump of every credential its configuration \
touched, and whole-file encryption is a bandage over keeping what nobody needed \
to keep. Two places see a real credential — the planner, comparing what a machine \
has against what the store holds, and the step that hands a provider what to \
write — and both reduce it on the way out. `Recorded` has no path back to a \
value, so the reduction cannot be undone downstream."""
enforced_by = [
  "crates/nerpa-core/src/planner.rs",
  "crates/nerpa-core/src/run.rs",
  "crates/nerpa-core/src/secret.rs",
]
tests = [
  "a_password_reaches_the_file_and_nothing_else",
  "a_rotated_secret_is_reported_as_changed",
  "the_same_value_under_two_keys_digests_differently",
  "values_that_are_not_equal_do_not_digest_equal",
]
bypass = "A secret value written where a digest was meant to go, or two different values digesting alike so a rotation is not noticed."
adversarial = [
  "values_that_are_not_equal_do_not_digest_equal",
  "the_same_value_under_two_keys_digests_differently",
]

[[invariant]]
id = "INV-SECRET-003"
status = "enforced"
statement = "A provider is never handed a secret out of state, because state never held one."
rationale = """
Deleting or relocating a resource reads its attributes back from state, and those \
attributes are how the provider finds it. A secret is not a locator — nothing is \
found by its password — so `Record::locator` yields the values and drops the \
digests. Anything that genuinely needs the credential fetches it from the store, \
which is the point of not keeping it."""
enforced_by = ["crates/nerpa-core/src/state.rs"]
tests = ["a_password_reaches_the_file_and_nothing_else"]
bypass = "A provider handed a credential recovered from state, which is only possible if state held one."
adversarial = [
  "a_password_reaches_the_file_and_nothing_else",
]

[[invariant]]
id = "INV-SECRET-004"
status = "claimed"
statement = "A secret can be passed to a resource and nothing else: not compared, indexed, iterated or used as a condition."
rationale = """
A configuration that can ask questions about a credential is a configuration that \
can answer them, and the answers travel in whatever the graph turns out to \
contain. Ordering, indexing and iteration are refused by the value itself, with a \
line number. Equality and containment cannot be — Starlark decides a comparison \
across types as `False` without consulting either value — so the syntax pass \
refuses them before evaluation, for a name bound to a secret as well as for a \
direct call. Truthiness has no error channel, so it is recorded and the whole \
evaluation is refused afterwards. Same three mechanisms as decision 0018, same \
reasons."""
enforced_by = [
  "crates/nerpa-config/src/handle.rs",
  "crates/nerpa-config/src/refuse.rs",
]
tests = [
  "a_secret_refuses_to_be_compared",
  "a_secret_held_in_a_variable_refuses_to_be_compared_too",
  "a_secret_refuses_to_be_a_condition",
]
bypass = "A secret reaching a comparison through a function *parameter*, which the analysis does not follow: doing so needs the call sites of every function. Inside such a function the value refuses when both sides are secrets, and Starlark answers silently when one side is a constant."
adversarial = [
  "a_secret_cannot_be_laundered_through_a_dictionary",
  "a_secret_passed_into_a_function_still_refuses_to_be_compared",
]

[[invariant]]
id = "INV-READ-001"
status = "enforced"
statement = "A read reports that nothing is there only when the world says nothing is there, never because looking failed."
rationale = """
A provider answers one of three things — what is there, that nothing is there, \
or that it could not tell — and an `Option` can only carry two. Collapsing the \
third into absence is the worst available answer: the plan proposes creating \
what already exists, and the apply overwrites it, losing its contents and \
resetting its mode. A file that may not be opened, one whose bytes are not text, \
a symlink, a socket: each is something, and none of them is nothing. \
`ProviderError::Unreachable` already says this about machines, and says why.

Bytes that are not text were briefly refused here and are now simply read, \
because `Value::Bytes` can hold them. The refusal was the right answer while the \
model could not describe the file; reading it is the right answer now."""
bypass = "Any filesystem call whose error is discarded — `.ok()?` on a read, a metadata call, a `read_link` — turns a failure back into absence, and nothing in the type of `read` prevents it. A provider tested only against its own fake would never notice: an in-memory backend has no permissions to deny and no bytes that are not text."
enforced_by = ["crates/nerpa-executor/src/lib.rs"]
tests = [
  "a_file_is_written_and_the_second_run_has_nothing_to_do",
  "a_file_edited_by_hand_is_brought_back",
]
adversarial = [
  "a_file_that_cannot_be_read_is_refused_rather_than_called_absent",
  "a_file_that_is_not_text_is_read_as_the_bytes_it_holds",
  "a_symlink_is_reported_as_a_symlink_and_not_followed",
  "a_broken_symlink_is_there_rather_than_absent",
]

[[invariant]]
id = "INV-DELETE-001"
status = "enforced"
statement = "Removing a resource removes that resource and nothing that was never declared."
rationale = """
A directory nerpa made may since have been filled by somebody else, and a \
recursive delete of what it never created is not a removal but a second, \
unannounced change — the plan showed one line and the run destroyed a tree. The \
same reasoning refuses to write through a symlink: the declaration names a path, \
and the file on the other side of a pointer is not that path. A directory with \
something in it fails the removal and says so, which is a person's decision to \
make rather than the tool's."""
bypass = "A removal that reaches for `remove_dir_all` because a non-empty directory is inconvenient, or a write that lands on a symlink and follows it into a file the declaration never named. Both read as correct against the in-memory fake, which has no directory that can be non-empty and no link to follow."
enforced_by = ["crates/nerpa-executor/src/lib.rs"]
tests = [
  "an_empty_directory_is_still_removed",
  "a_resource_removed_from_the_configuration_is_removed_from_the_machine",
]
adversarial = [
  "deleting_a_directory_does_not_take_what_nerpa_did_not_make",
  "writing_where_a_symlink_is_replaces_the_link_and_leaves_its_target_alone",
]

[[invariant]]
id = "INV-VALUE-001"
status = "enforced"
statement = "A value written into state or a plan reads back as the value that was written."
rationale = """
State and the plan are the two places a value survives the process that made it, \
and both are JSON. JSON has no way to say "these are bytes": an array of numbers \
is indistinguishable from a list of integers, and a string from text. So binary \
content is written as base64 under a reserved key — and the one map that would \
read back as bytes rather than as itself is refused at the point of writing, so \
no reader is ever left to guess. The same value goes onto the wire as a real CBOR \
byte string, which is the property CBOR was chosen for and had not been asked to \
do.

Bytes that are text are text. Without that a file holding `hello` could be either \
variant depending on which side of the model built it, the two would compare \
unequal, and no second run would ever be empty."""
bypass = "A map whose only key is the reserved one, holding text that decodes as base64, written down and read back as bytes. Or a byte sequence that is valid UTF-8 built as `Value::Bytes` directly rather than through `Value::bytes`, which then never equals the text the provider reads back."
enforced_by = ["crates/nerpa-core/src/value.rs"]
tests = [
  "every_other_shape_still_round_trips",
  "bytes_survive_a_state_file",
  "bytes_that_are_text_become_text",
]
adversarial = [
  "a_map_shaped_like_bytes_is_refused_rather_than_silently_misread",
  "a_map_that_only_resembles_the_reserved_shape_is_left_alone",
  "text_and_bytes_are_not_the_same_value",
]

[[invariant]]
id = "INV-GRAPH-005"
status = "enforced"
statement = "A configuration that cannot be ordered stops the run, and never reads as a configuration that declares nothing."
rationale = """
`Graph::stages` returns a `Result`, and every convenient way of getting past a \
`Result` in an iterator chain — `flatten`, `ok`, `unwrap_or_default` — turns the \
error into an empty sequence. A cycle then reads as a configuration with no \
resources in it: the run continues, looks only at what state remembers, and is \
wrong about what it is doing rather than stopped. The graph is the thing being \
asked about, so failing to derive it is the end of the question."""
bypass = "Any `Result` from the graph passed through `flatten`, `ok()`, `unwrap_or_default` or `iter().flatten()` on the way into a collection. Each reads as tidy iterator code and each silently substitutes an empty configuration for a refusal — which is how this one arrived."
enforced_by = ["crates/nerpa-core/src/run.rs"]
tests = [
  "every_resource_on_one_machine_is_asked_for_at_once",
  "something_only_state_remembers_travels_with_the_rest",
]
adversarial = ["a_graph_that_cannot_be_ordered_stops_the_run_rather_than_reading_as_empty"]

[[invariant]]
id = "INV-STATE-005"
status = "enforced"
statement = "What a run has already made is written down before it touches the next thing."
rationale = """
A run that stops half way has made real changes. State used to be written once, \
after the whole loop returned, so anything that stopped it — a machine that went \
away, a contract violation panicking by design, somebody's Ctrl-C — left every \
resource that run had already made with nothing recording that it exists. They \
were not rolled back; they were forgotten, and the next run would propose making \
them again beside the ones already there.

`apply` takes a place to write to and uses it after every change. What that \
costs is the caller's decision, which is why it is a callback rather than a path: \
the command writes the state file each time, and a test that only wants to know \
what ended up in state can do nothing at all."""
bypass = "A change applied without the record being called after it — a new branch in the loop, or an early `continue`. Nothing in the types ties one to the other, so the loop is the only thing keeping them in step."
enforced_by = ["crates/nerpa-core/src/run.rs"]
tests = [
  "a_file_is_written_and_the_second_run_has_nothing_to_do",
  "a_resource_removed_from_the_configuration_is_removed_from_the_machine",
]
adversarial = ["what_was_already_made_is_recorded_before_the_next_thing_is_touched"]

[[invariant]]
id = "INV-PROVIDER-001"
status = "enforced"
statement = "One provider serves every machine, so the interface is shareable across threads."
rationale = """
Stage 3 visits machines in parallel and one registry serves all of them, so a \
provider is used from several threads at once. The bound sits on the trait rather \
than on each implementation because the trait is what people outside this \
repository write against, and it is added now because there are none of them yet: \
after the repository opens, adding it breaks somebody else's code and they are \
not in the room to argue. See decision 0031."""
bypass = "Taking the bound off again, because nothing needs it until stage 3 and everything compiles without it until then. That is the whole risk: it is a promise about an interface that no caller depends on yet, so nothing but this entry and the test beside it notices its absence."
enforced_by = ["crates/nerpa-core/src/provider.rs"]
tests = ["a_file_is_written_and_the_second_run_has_nothing_to_do"]
adversarial = ["one_provider_serves_two_threads_at_once"]

[[invariant]]
id = "INV-PLAN-005"
status = "enforced"
statement = "An attribute handed to a provider comes back from it, or the run stops."
rationale = """
Reporting an attribute is the provider's claim that it took it. One that goes in \
and does not come out never settles: the next plan finds it missing from the \
reading, proposes the same change, and every run after that does the same for \
ever. The tool stops converging and says nothing — which is worse than failing, \
because a second run that is not empty is the one signal this whole design rests \
on.

Measured on a file declared with an attribute the `os` provider does not own. It \
applied cleanly and re-planned indefinitely.

The check is generic rather than schema-driven, so a provider written outside \
this repository gets it whether its author thought about it or not. A provider \
that cannot read a value back — a credential the cloud will not return — echoes \
it, and the echo is the claim. What it may not do is say nothing."""
bypass = "A provider that echoes every attribute it was given without acting on any of them satisfies this and converges on a lie. The check catches an attribute nobody owns, not an attribute somebody claims and drops — for that there is only reading the world back, which is what `apply` already does everywhere it can."
enforced_by = ["crates/nerpa-core/src/run.rs"]
tests = [
  "a_provider_that_echoes_what_it_cannot_read_back_is_accepted",
  "a_file_is_written_and_the_second_run_has_nothing_to_do",
]
adversarial = [
  "an_attribute_that_is_not_reported_back_stops_the_run_rather_than_never_settling",
  "what_was_made_before_the_refusal_is_still_recorded",
]

[[invariant]]
id = "INV-PLAN-006"
status = "enforced"
statement = "A plan has one number covering everything it intends to do, and a plan that could not look at everything has none."
rationale = """
Three things rest on it and each is worth exactly what it is worth. `0033` lets a \
batch of operations run anything, and what limits that authority is the plan it \
came from. `0034` binds the premise to it. `0009` has a third party sign it.

It covers the intent: the stages, and every change in them — the address, the \
kind, the whole desired state and every delta. Not what the plan could not see, \
and not what it merely reports; those belong to the premise, which covers what \
the plan was computed *from*. Between the two the whole plan is accounted for and \
neither is doing the other's job.

A plan carrying an unreachable machine has none at all. Such a plan carries how \
old that knowledge is, an age moves every second, and a number over it would \
never settle — so it says why instead of offering one that cannot be compared \
twice. `INV-REACH-003` already refuses to call such a plan complete.

The encoding is written out rather than borrowed from a serialisation format, \
carries a domain prefix, and has no catch-all arm anywhere: adding a variant to \
any of the enums it walks stops the build, which is the right place to be asked \
how it hashes rather than having two different plans quietly share a number."""
bypass = "Anything a person approves that is not inside the number: a field added to a change and not to the encoding, or a catch-all arm folding an unknown variant into a default. Both leave a signature covering a plan that is not the one that runs, and neither shows up as a failure — only as two plans with one number."
enforced_by = ["crates/nerpa-core/src/plan.rs"]
tests = [
  "the_same_plan_is_the_same_number_every_time",
  "a_plan_with_nothing_in_it_still_has_one",
]
adversarial = [
  "every_part_of_a_change_moves_the_number",
  "text_that_runs_together_does_not_collide",
  "a_plan_that_could_not_look_at_everything_has_no_number",
]

[[invariant]]
id = "INV-TEMPLATE-001"
status = "enforced"
statement = "A template sees the values it was handed and nothing else, and cannot reach the world."
rationale = """
A template that reads the world renders differently every time, and a plan \
computed from it could not be compared, hashed or signed — the same reasoning \
that chose Starlark over a scripting language in `0005`. So: no clock, no \
environment, no process, no network, and no filesystem beyond the directory the \
configuration sits in. There is no `lookup` and nothing like one.

There is no ambient scope either. Ansible's twenty-two precedence levels are \
refused here as everywhere else: what a template can see is what the call handed \
it, and a value that was not handed over is a refusal rather than an empty \
string — for a configuration file the difference is a directive that silently \
disappears.

The filters are a list this project keeps rather than whatever `minijinja` ships. \
Every one of them is part of what a configuration may rely on (`0022`), so an \
upgrade must not widen the set without somebody deciding to. Execution is \
bounded by fuel and a recursion limit."""
bypass = "A filter, test or global added to the list that reaches the world — `now`, `env`, anything that opens a file. The list is the boundary, so widening it is the way through it, and it is one line of a diff. Below that, a template source that resolves a name outside the configuration's directory: shape is checked before the disk is touched and the resolved path afterwards, but a source written elsewhere answers however it likes."
enforced_by = ["crates/nerpa-config/src/template.rs"]
tests = ["templates_written_for_ansible_render_here"]
adversarial = [
  "a_value_that_was_not_handed_over_is_a_refusal_rather_than_a_blank",
  "nothing_is_in_scope_that_was_not_handed_over",
  "a_filter_that_is_not_on_the_list_is_refused_by_name",
  "a_template_that_would_not_stop_is_stopped",
  "a_template_cannot_be_named_outside_the_configuration",
]

[[invariant]]
id = "INV-PREMISE-001"
status = "enforced"
statement = "A batch does nothing at all when what the plan was computed from has moved."
rationale = """
Reading everything once, planning once and applying once is what makes central \
provider logic affordable (`0032`), and it opens a window nobody else's tool has \
to open this wide: between the looking and the doing, ours is the whole run where \
Ansible's is one task.

So the batch carries the premise — what the plan was computed from, and what each \
of those hashed to — and the executor looks again before it does anything. All of \
it, before any of it: a batch acting on half a stale reading is worse than one \
that did not act. The digest is computed identically on both ends, from an \
encoding written out in the protocol rather than borrowed from CBOR.

A premise that no longer holds is answered with `Moved`, not `Failed`. "Look \
again and plan again" is different advice to "something went wrong", and a person \
woken at three in the morning should be told which."""
bypass = "An operation whose effect was not derived from anything in the premise — a provider that emits a process without recording what it read to decide on it. The check is only as wide as what the plan admits it looked at, and nothing forces a provider to admit everything."
enforced_by = ["crates/nerpa-executor/src/lib.rs"]
tests = ["what_it_did_is_read_back_rather_than_echoed"]
adversarial = ["a_batch_whose_premise_moved_does_nothing_and_says_which"]

[[invariant]]
id = "INV-FACT-001"
status = "enforced"
statement = "Something read from a machine may decide what an attribute says and never whether a resource exists."
rationale = """
A single planning pass is possible because the set of resources is known before \
anything runs. A fact is not known then — it is what the machine turned out to \
be — so letting one decide which resources exist would take the property the \
whole design rests on.

But a path that differs by distribution is a *value*, and refusing that outright \
would make the tool unusable on a mixed fleet. So `select(fact, {closed set})` is \
the mechanism and the only one: every branch is written down, the graph is the \
same whichever way it goes, and what is open is the value — within a set the plan \
prints, which is more useful than "unknown after apply" because a person can \
approve a set.

A machine that says something no branch accounts for is refused, not defaulted. A \
silent default is a machine configured as though it were a different one, which \
is worse than a machine that is not configured."""
bypass = "A fact reaching a condition. Comparison, ordering, indexing and iteration are refused by the value, truthiness poisons the run, and the syntax pass catches the comparisons Starlark answers without consulting a value — but that pass does not follow a function parameter, so a fact handed into a function and compared inside it is silently false there, exactly as `INV-PLAN-001` describes for a handle."
enforced_by = [
  "crates/nerpa-config/src/handle.rs",
  "crates/nerpa-core/src/planner.rs",
]
tests = [
  "a_value_may_be_chosen_by_what_a_machine_turns_out_to_be",
  "a_value_chosen_by_a_fact_settles_from_the_machine",
]
adversarial = [
  "a_fact_cannot_decide_whether_a_resource_exists",
  "a_fact_refuses_to_be_a_condition_on_its_own",
  "a_machine_that_says_something_unaccounted_for_is_refused",
]

[[invariant]]
id = "INV-FLEET-001"
status = "enforced"
statement = "What the fleet says may decide which resources exist; what a machine says may not."
rationale = """
The pair to `INV-FACT-001`, and the line decision 0025 draws. A fleet document is \
settled before the program is evaluated: which machines exist is decided by a \
person or by the cloud stage, and it is data by the time anything reads it. So it \
may be iterated, compared and branched on, and `for host in group("web")` builds \
a graph for a hundred machines without breaking the rule that composition is \
known before anything runs.

A fact is the other thing entirely — what a machine turned out to be, discovered \
by looking — and letting one decide which resources exist would take the property \
a single planning pass rests on.

Two groups giving one node the same key is an error naming both. Ansible answers \
"where did this value come from" with twenty-two precedence levels; here the \
question has one answer per value, and a collision is something somebody decides \
rather than something a rule decides for them. A node overriding its groups is \
allowed, because that is a statement rather than a rank."""
bypass = "A fleet that is not settled before evaluation — a dynamic inventory read at run time and used directly rather than materialised. Then \"data by the time the program sees it\" stops being true, and a graph built from it is a graph nobody can reproduce or hash. Nothing does this yet, which is why the dynamic half is unbuilt rather than half-built."
enforced_by = ["crates/nerpa-config/src/fleet.rs"]
tests = [
  "a_group_is_iterated_and_a_hundred_machines_are_not_a_hundred_declarations",
  "a_node_may_say_what_its_groups_do_not",
  "only_the_machines_a_run_reaches_for_join_its_inventory",
]
adversarial = [
  "two_groups_giving_one_node_the_same_key_is_an_error_naming_both",
  "a_value_the_fleet_does_not_give_is_a_refusal_rather_than_a_default",
  "what_the_fleet_says_may_decide_which_resources_exist",
]
